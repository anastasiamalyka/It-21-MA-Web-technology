
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея картин</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Галерея картин</h1>
        <p>Облік картин та їхніх авторів</p>

        <form id="paintingForm">
            <input type="hidden" id="paintingId">

            <label for="artist">Автор картини</label>
            <input type="text" id="artist"
                   placeholder="Наприклад, Claude Monet" required>

            <label for="title">Назва картини</label>
            <input type="text" id="title"
                   placeholder="Назва картини" required>

            <label for="year">Рік створення</label>
            <input type="number" id="year"
                   min="1" max="2026" placeholder="Наприклад, 1916"
                   required>

            <button type="submit" id="saveButton">
                Додати картину
            </button>
            <button type="button" id="cancelButton" hidden>
                Скасувати редагування
            </button>
        </form>

        <h2>Список картин</h2>

        <input type="text" id="search"
               placeholder="Пошук за автором або назвою">

        <div id="paintingsList"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
